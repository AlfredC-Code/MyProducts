<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A simple gallery of items for sale.">
  <meta name="robots" content="noindex,nofollow">
  <title>Items</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <div>
        <p class="eyebrow">GALLERY</p>
        <h1>Items</h1>
        <p class="subtitle">A simple collection of items currently available.</p>
      </div>
      <div class="header-meta" aria-label="Gallery status">
        <span id="itemCount">Loading…</span>
      </div>
    </div>
  </header>

  <main class="shell">
    <section class="toolbar" aria-label="Gallery filters">
      <div class="segmented" role="group" aria-label="Filter by status">
        <button class="filter-btn active" type="button" data-filter="all">All</button>
        <button class="filter-btn" type="button" data-filter="available">Available</button>
        <button class="filter-btn" type="button" data-filter="pending">Pending</button>
        <button class="filter-btn" type="button" data-filter="sold">Sold</button>
      </div>
      <label class="search-wrap">
        <span class="sr-only">Search items</span>
        <input id="searchInput" type="search" placeholder="Search items…" autocomplete="off">
      </label>
    </section>

    <section>
      <div id="gallery" class="gallery" aria-live="polite"></div>
      <div id="emptyState" class="empty-state" hidden>
        <h2>No items found</h2>
        <p>Try a different search or filter.</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="shell">
      <p>Listings may change without notice.</p>
    </div>
  </footer>

  <dialog id="productDialog" class="product-dialog" aria-labelledby="dialogTitle">
    <div class="dialog-shell">
      <button id="closeDialog" class="icon-btn close-btn" type="button" aria-label="Close item details">×</button>
      <div class="dialog-grid">
        <section class="viewer" aria-label="Product photos">
          <div class="main-image-wrap">
            <button id="prevImage" class="nav-btn nav-prev" type="button" aria-label="Previous image">‹</button>
            <img id="dialogImage" src="" alt="">
            <button id="nextImage" class="nav-btn nav-next" type="button" aria-label="Next image">›</button>
          </div>
          <div id="thumbs" class="thumbs" aria-label="Choose photo"></div>
        </section>

        <section class="product-info">
          <div class="product-title-row">
            <div>
              <p id="dialogStatus" class="status-badge"></p>
              <h2 id="dialogTitle"></h2>
            </div>
            <p id="dialogPrice" class="dialog-price"></p>
          </div>

          <p id="dialogDescription" class="dialog-description"></p>

          <dl class="details-list">
            <div>
              <dt>Condition</dt>
              <dd id="dialogCondition"></dd>
            </div>
            <div>
              <dt>Status</dt>
              <dd id="dialogStatusText"></dd>
            </div>
          </dl>
        </section>
      </div>
    </div>
  </dialog>

  <script src="app.js" defer></script>
</body>
</html>
